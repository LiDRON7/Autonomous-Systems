# Autonomy on the drone's Raspberry Pi. PX4 and the sensors come from the
# Sensor-Control-Data-Gathering containers (px4-agent, oak-d; airborne-bridge only with the radio-bridge profile).
services:
  autonomy:
    image: lidron-autonomy:jazzy-px4-1.15
    build:
      context: ..
      dockerfile: integration/Dockerfile
    container_name: lidron_autonomy
    network_mode: host
    # Same IPC namespace as the sensor containers, or DDS shared memory drops their data.
    ipc: host
    init: true
    # Safe to start at boot: hardware mode never auto-starts a mission.
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # The sensor containers run as other users, so Fast DDS shared memory fails; use UDP.
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - AUTONOMY_CONFIG=hardware
      # No default on purpose: each Pi says which drone it is in integration/.env (DRONE=widow or DRONE=huntsman).
      - DRONE=${DRONE:?set DRONE=widow or DRONE=huntsman in integration/.env}
    volumes:
      - ..:/autonomy
