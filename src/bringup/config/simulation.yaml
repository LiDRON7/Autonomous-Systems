# These numbers are for Huntsman, the simulator's default drone (Simulation/tools/cad_to_sdf.py prints them).
# For DRONE=widow: require_lidar: false (it has no LiDAR) and map.sensor_translation_flu_m: [0.083, 0.001, -0.047].
/**:
  ros__parameters:
    use_sim_time: true
    lidar_topic: /lidar/points

perception:
  ros__parameters:
    depth_topic: /oakd/depth/image
    # Puck LITE on its side, as in the CAD and the simulator model: roll 90, pitch 135.
    lidar_mount_rpy_deg: [90.0, 135.0, 0.0]
    obstacle_threshold_m: 1.5
    depth_roi_ratio: 0.4
    landing.footprint_m: 1.2
    landing.min_points: 80
    landing.max_slope_deg: 8.0
    landing.max_roughness_m: 0.08
    landing.obstacle_height_m: 0.20
    landing.clearance_m: 0.75
    filters.voxel_size_m: 0.03
    filters.outlier_mean_k: 50
    filters.outlier_threshold: 3.0
    roi.x_min: -10.0
    roi.x_max: 10.0
    roi.y_min: -10.0
    roi.y_max: 10.0
    # Enable Z cropping only after checking the LiDAR frame and ground height.
    roi.z_enabled: false
    roi.z_min: -10.0
    roi.z_max: 10.0
    # Drop the drone's own returns: everything within half a metre that is level with the LiDAR or above it
    # (landing frame: x forward, y right, z down). Not yet checked against a recorded cloud.
    self_filter.enabled: true
    self_filter.x_min: -0.5
    self_filter.x_max: 0.5
    self_filter.y_min: -0.3
    self_filter.y_max: 0.3
    self_filter.z_min: -0.4
    self_filter.z_max: 0.05
    ransac.dist_threshold: 0.01
    ransac.num_iterations: 500

mission:
  ros__parameters:
    auto_start: false
    hardware_mode: false
    destination.north: 8.0
    destination.east: 0.0
    destination.down: -5.0
    cruise_altitude_m: 5.0
    arrival_tolerance_m: 0.75
    sensor_timeout_s: 1.5
    hold_timeout_s: 8.0
    mission_timeout_s: 300.0
    map.resolution: 0.5
    map.size_m: 30.0
    map.inflation_m: 1.0
    map.expiry_s: 2.0
    # Camera lens from the centre of mass, and its 10 deg downward tilt (Huntsman README).
    map.sensor_translation_flu_m: [0.134, 0.0, -0.037]
    map.sensor_pitch_down_deg: 10.0
    map.min_height_m: -1.5
    map.max_height_m: 1.5
    landing_confirmations: 8
    landing_check_timeout_s: 5.0
    landing_search_step_m: 1.5
    landing_search_limit: 8
