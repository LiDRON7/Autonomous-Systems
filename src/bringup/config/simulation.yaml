/**:
  ros__parameters:
    use_sim_time: true

perception:
  ros__parameters:
    depth_topic: /oakd/depth/image
    lidar_topic: /lidar/points
    obstacle_threshold_m: 1.5
    depth_roi_ratio: 0.4
    landing.footprint_m: 1.2
    landing.min_points: 80
    landing.max_slope_deg: 8.0
    landing.max_roughness_m: 0.08
    landing.obstacle_height_m: 0.20
    landing.clearance_m: 0.75

mission:
  ros__parameters:
    auto_start: false
    hardware_mode: false
    destination.north: 8.0
    destination.east: 0.0
    destination.down: -5.0
    cruise_altitude_m: 5.0
    arrival_tolerance_m: 0.75
    sensor_timeout_s: 1.5
    hold_timeout_s: 8.0
    mission_timeout_s: 300.0
    map.resolution: 0.5
    map.size_m: 30.0
    map.inflation_m: 1.0
    map.expiry_s: 2.0
    map.min_height_m: -1.5
    map.max_height_m: 1.5
    landing_confirmations: 8
    landing_check_timeout_s: 5.0
    landing_search_step_m: 1.5
    landing_search_limit: 8
