# Settings for flying on the Pi. The drone's own numbers come from widow.yaml or huntsman.yaml.
/**:
  ros__parameters:
    use_sim_time: false
    # Off until Huntsman's LiDAR frame is checked in RViz with the sensor mounted. Widow never uses it (widow.yaml).
    require_lidar: false
    # The Velodyne driver's topic. Perception and the preflight check both read it from here.
    lidar_topic: /velodyne_points

perception:
  ros__parameters:
    depth_topic: /oakd/depth/image
    obstacle_threshold_m: 2.0
    depth_roi_ratio: 0.4
    landing.footprint_m: 1.5
    landing.min_points: 120
    landing.max_slope_deg: 6.0
    landing.max_roughness_m: 0.06
    landing.obstacle_height_m: 0.15
    landing.clearance_m: 1.0
    filters.voxel_size_m: 0.03
    filters.outlier_mean_k: 50
    filters.outlier_threshold: 3.0
    roi.x_min: -10.0
    roi.x_max: 10.0
    roi.y_min: -10.0
    roi.y_max: 10.0
    # Enable Z cropping only after checking the LiDAR frame and ground height.
    roi.z_enabled: false
    roi.z_min: -10.0
    roi.z_max: 10.0
    # Enable only after measuring the physical vehicle in its LiDAR frame.
    self_filter.enabled: false
    self_filter.x_min: -0.22
    self_filter.x_max: 0.22
    self_filter.y_min: -0.22
    self_filter.y_max: 0.22
    self_filter.z_min: -0.08
    self_filter.z_max: -0.02
    ransac.dist_threshold: 0.01
    ransac.num_iterations: 500

mission:
  ros__parameters:
    auto_start: false
    hardware_mode: true
    cruise_altitude_m: 5.0
    arrival_tolerance_m: 0.75
    sensor_timeout_s: 0.75
    hold_timeout_s: 5.0
    mission_timeout_s: 300.0
    map.resolution: 0.4
    map.size_m: 25.0
    map.inflation_m: 1.25
    map.expiry_s: 1.5
    map.min_height_m: -1.5
    map.max_height_m: 1.5
    landing_confirmations: 12
    landing_check_timeout_s: 8.0
    landing_search_step_m: 1.5
    landing_search_limit: 8
